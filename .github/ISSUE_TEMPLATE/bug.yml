name: Defecto reproducible
description: Reportar un comportamiento con evidencia y condiciones concretas.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "No incluir credenciales, cookies, bases ni datos personales. Vulnerabilidades: usar el canal privado de SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Entorno y versión
      description: SHA, local o despliegue, navegador/ancho móvil y base/proveedor sin credenciales.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos mínimos con datos sintéticos
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Resultado esperado y observado
      description: Separar lo reportado de lo reproducido. Añadir HTTP/error saneado si existe.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación y validación
      description: Cómo comprobar la corrección, persistencia y aislamiento cuando corresponda.
    validations:
      required: true
